<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C20 62 8 46 8 30 8 17 18 9 29 9c9 0 17 5 21 13 4-8 12-13 21-13 11 0 21 8 21 21 0 16-12 32-42 58z' fill='%23F0263F'/%3E%3C/svg%3E">
<style>
  @font-face {
    font-family: "Mea Culpa";
    src: url("MeaCulpa-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --mint: #CEFFF1;
    --text: #ACE7EF;
    --cake: #A6ACEC;
    --bg: #A56CC1;
    --top: clamp(5.5rem, 19vh, 10rem);      /* band reserved for the title */
    --bottom: clamp(3.8rem, 12vh, 6.5rem);  /* band reserved for the hint  */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Mea Culpa", cursive;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: relative;
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(var(--top) + env(safe-area-inset-top)) 0 calc(var(--bottom) + env(safe-area-inset-bottom));
  }

  /* ---------- text ---------- */
  .glow-text {
    color: var(--text);
    text-shadow: 0 2px 0 rgba(72, 28, 104, .35), 0 6px 22px rgba(72, 28, 104, .35);
  }

  .title {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 1.5vh);
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(3rem, min(14vw, 11vh), 7.5rem);
    line-height: 1.1;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: scale(.6) translateY(-20px);
    z-index: 3;
  }
  .title.show {
    animation: titleIn .9s cubic-bezier(.2, 1.4, .4, 1) forwards;
  }
  .title .heart-inline {
    display: inline-block;
    width: .62em;
    height: .62em;
    margin-left: .08em;
    vertical-align: -.02em;
    filter: drop-shadow(0 3px 4px rgba(72, 28, 104, .35));
    animation: beat 1.3s ease-in-out infinite 1s;
    transform-origin: 50% 60%;
  }
  @keyframes titleIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes beat {
    0%, 55%, 100% { transform: scale(1); }
    15% { transform: scale(1.22); }
    30% { transform: scale(.98); }
    42% { transform: scale(1.12); }
  }

  .hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 2.5vh);
    left: 0; right: 0;
    text-align: center;
    font-size: clamp(2rem, 5.2vw, 3rem);
    pointer-events: none;
    opacity: 0;
    z-index: 3;
  }
  .hint.show { animation: hintIn .8s cubic-bezier(.2, 1.5, .4, 1) forwards, hintFloat 2.4s ease-in-out 1s infinite; }
  .hint.gone { animation: hintOut .4s ease forwards; }
  @keyframes hintIn {
    from { opacity: 0; transform: scale(.7) translateY(14px); }
    to   { opacity: .9; transform: scale(1) translateY(0); }
  }
  @keyframes hintFloat {
    0%, 100% { opacity: .9; transform: translateY(0); }
    50%      { opacity: .6; transform: translateY(-4px); }
  }
  @keyframes hintOut {
    to { opacity: 0; transform: translateY(10px); }
  }

  /* ---------- cake ---------- */
  .cake-btn {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    /* width is capped by the height left between the title and hint bands (svg ratio 660:575) */
    width: min(94vw, calc((100vh - var(--top) - var(--bottom)) * 1.148), 880px);
    width: min(94vw, calc((100dvh - var(--top) - var(--bottom)) * 1.148), 880px);
    border-radius: 24px;
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(40px) scale(.92);
    animation: cakeIn 1s cubic-bezier(.2, 1.2, .4, 1) .15s forwards;
    outline: none;
  }
  .cake-btn:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
  .cake-btn svg { display: block; width: 100%; height: auto; overflow: visible; }
  .cake-inner { transform-origin: 50% 90%; }
  .cake-btn.idle .cake-inner { animation: bob 4.2s ease-in-out infinite; }
  .cake-btn:hover .cake-inner { transform: scale(1.015); transition: transform .25s; }
  .cake-btn.pop .cake-inner { animation: squish .6s cubic-bezier(.3, 1.6, .5, 1); }

  .hrt, .berry { filter: drop-shadow(0 3px 2px rgba(60, 20, 90, .28)); }

  @keyframes cakeIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes squish {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.06, .92); }
    55%  { transform: scale(.97, 1.05); }
    100% { transform: scale(1, 1); }
  }

  /* ---------- confetti + mute ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .mute {
    position: fixed;
    bottom: max(.9rem, env(safe-area-inset-bottom));
    right: .9rem;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--text);
    background: rgba(72, 28, 104, .18);
    color: var(--text);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 6;
  }
  .mute.show { display: flex; }
  .mute:focus-visible { outline: 3px dashed var(--text); outline-offset: 3px; }
  .mute svg { width: 22px; height: 22px; }
  .mute .off { display: none; }
  .mute.muted .on { display: none; }
  .mute.muted .off { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .cake-btn.idle .cake-inner, .title .heart-inline, .hint.show { animation: none; }
    .cake-btn { animation-duration: .01s; animation-delay: 0s; }
    .hint.show { opacity: .9; }
  }
</style>

      <path d="M0,-20 C0,-50 -50,-50 -50,-15 C-50,15 -15,35 0,55 C15,35 50,15 50,-15 C50,-50 0,-50 0,-20 Z" fill="url(#heartGrad)"/>
      <path d="M0,-20 C0,-50 -50,-50 -50,-15 C-50,15 -15,35 0,55 C15,35 50,15 50,-15 C50,-50 0,-50 0,-20 Z" fill="none" stroke="#B8142E" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>

  <g class="hrt" transform="translate(364,392) rotate(-16) scale(0.9)">
      <path d="M0,-20 C0,-50 -50,-50 -50,-15 C-50,15 -15,35 0,55 C15,35 50,15 50,-15 C50,-50 0,-50 0,-20 Z" fill="url(#heartGrad)"/>
      <path d="M0,-20 C0,-50 -50,-50 -50,-15 C-50,15 -15,35 0,55 C15,35 50,15 50,-15 C50,-50 0,-50 0,-20 Z" fill="none" stroke="#B8142E" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>

  <p class="hint glow-text" id="hint">Click the cake</p>

  <button class="mute" id="mute" aria-label="Mute music">
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
  </button>

<canvas id="confetti" aria-hidden="true"></canvas>

<audio id="song" src="Shut_Up_and_Dance.webm" preload="auto" loop></audio>

<script>
(function () {
  var cakeBtn = document.getElementById('cakeBtn');
  var title   = document.getElementById('title');
  var hint    = document.getElementById('hint');
  var song    = document.getElementById('song');
  var muteBtn = document.getElementById('mute');
  var canvas  = document.getElementById('confetti');
  var ctx     = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- intro: cake rises, then the hint pops up ---- */
  setTimeout(function () { cakeBtn.classList.add('idle'); }, 1200);
  setTimeout(function () { hint.classList.add('show'); }, 1500);

  /* ---- canvas sizing ---- */
  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ---- confetti ---- */
  var COLORS = ['#CEFFF1', '#ACE7EF', '#A6ACEC', '#FFFFFF', '#FF5D73', '#FF8FAB', '#FFD166', '#FF9F68'];
  var parts = [];
  var running = false;
  var rainUntil = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function make(x, y, vx, vy) {
    var shapes = ['rect', 'rect', 'circle', 'heart'];
    return {
      x: x, y: y, vx: vx, vy: vy,
      size: rand(7, 13),
      color: COLORS[(Math.random() * COLORS.length) | 0],
      shape: shapes[(Math.random() * shapes.length) | 0],
      rot: rand(0, Math.PI * 2),
      vr: rand(-.25, .25),
      tilt: rand(0, Math.PI * 2),
      vt: rand(.05, .2),
      life: 0,
      max: rand(160, 260)
    };
  }

  function burst() {
    var r = cakeBtn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height * 0.42;
    var n = reduceMotion ? 50 : 150;
    for (var i = 0; i < n; i++) {
      var a = rand(-Math.PI * .95, -Math.PI * .05);
      var s = rand(6, 17);
      parts.push(make(cx + rand(-40, 40), cy, Math.cos(a) * s, Math.sin(a) * s));
    }
    // two side cannons
    for (var k = 0; k < (reduceMotion ? 0 : 50); k++) {
      var left = k % 2 === 0;
      var a2 = left ? rand(-1.3, -.7) : rand(-2.4, -1.85);
      var s2 = rand(10, 20);
      parts.push(make(left ? 0 : W, H * .85, Math.cos(a2) * s2, Math.sin(a2) * s2));
    }
    rainUntil = performance.now() + (reduceMotion ? 0 : 2500);
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }

  function drawHeart(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * .35);
    ctx.bezierCurveTo(-s * .9, -s * .1, -s * .5, -s * .8, 0, -s * .35);
    ctx.bezierCurveTo(s * .5, -s * .8, s * .9, -s * .1, 0, s * .35);
    ctx.fill();
  }

  var last = 0;
  function tick(now) {
    var dt = Math.min((now - last) / 16.67, 2.5); last = now;
    ctx.clearRect(0, 0, W, H);

    if (now < rainUntil && Math.random() < .75) {
      parts.push(make(rand(0, W), -12, rand(-2, 2), rand(1, 4)));
    }

    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += .32 * dt;
      p.vx *= Math.pow(.985, dt);
      p.vy *= Math.pow(.985, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt; p.tilt += p.vt * dt;
      p.life += dt;
      if (p.y > H + 30 || p.life > p.max) { parts.splice(i, 1); continue; }

      var fade = p.life > p.max - 40 ? (p.max - p.life) / 40 : 1;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      var flip = Math.cos(p.tilt);
      if (p.shape === 'rect') {
        ctx.scale(1, flip);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.shape === 'circle') {
        ctx.scale(1, flip);
        ctx.beginPath(); ctx.arc(0, 0, p.size / 3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.scale(1, flip * .6 + .4);
        drawHeart(p.size * .8);
      }
      ctx.restore();
    }

    if (parts.length || now < rainUntil) {
      requestAnimationFrame(tick);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  /* ---- music ---- */
  function startMusic() {
    if (!song.paused) return;
    song.volume = .9;
    var p = song.play();
    if (p && p.catch) p.catch(function () { /* file missing or blocked: stay quiet */ });
  }

  muteBtn.addEventListener('click', function () {
    song.muted = !song.muted;
    muteBtn.classList.toggle('muted', song.muted);
    muteBtn.setAttribute('aria-label', song.muted ? 'Unmute music' : 'Mute music');
  });

  /* ---- the click ---- */
  var celebrated = false;
  cakeBtn.addEventListener('click', function () {
    burst();

    cakeBtn.classList.remove('pop'); void cakeBtn.offsetWidth; cakeBtn.classList.add('pop');

    if (!celebrated) {
      celebrated = true;
      title.classList.add('show');
      hint.classList.remove('show'); hint.classList.add('gone');
      muteBtn.classList.add('show');
    }
    startMusic();
  });
})();
</script>
</body>
